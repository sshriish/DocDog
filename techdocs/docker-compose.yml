services:
  db:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: techdocs, POSTGRES_PASSWORD: techdocs, POSTGRES_DB: techdocs}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    env_file: .env
    depends_on: [db]
    ports: ["8000:8000"]
    command: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./backend:/app"]
  worker:
    build: ./backend
    env_file: .env
    depends_on: [db]
    command: python -m worker.runner
    volumes: ["./backend:/app"]
volumes:
  pgdata:
